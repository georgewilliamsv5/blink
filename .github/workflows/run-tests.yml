name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.sh'
      - .github/workflows/**.yml'
  workflow_call:


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run pytest -q
